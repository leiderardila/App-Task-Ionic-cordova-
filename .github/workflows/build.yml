name: Build APK e IPA

# Ejecución manual: Actions > "Build APK e IPA" > Run workflow
on:
  workflow_dispatch:

jobs:
  apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npx ng build

      - name: Compilar el APK (debug)
        run: |
          npx cordova platform add android
          npx cordova build android

      - uses: actions/upload-artifact@v4
        with:
          name: App-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

  ipa:
    name: IPA (iOS, sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npx ng build

      - name: Agregar y preparar la plataforma iOS
        run: |
          npx cordova platform add ios
          npx cordova prepare ios

      - name: Archivar sin firma
        run: |
          PROJECT=$(ls -d platforms/ios/*.xcodeproj | head -n 1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar el .ipa
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/App-unsigned.ipa" Payload)
          ls -lh App-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: App-unsigned.ipa
